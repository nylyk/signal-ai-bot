services:
  signal-ai-bot:
    build: .
    user: 1000:1000
    # share the host network so localhost reaches llama.cpp
    # (when deploying you would want them to be in the same network)
    network_mode: host
    environment:
      RUST_LOG: signal_ai_bot=debug
      API_BASE: http://localhost:8080/v1
      API_KEY: not-needed
      MODEL: qwen3.6
      SYSTEM_PROMPT: You're a companion in a Signal chat. Keep your answers short. You will see recent messages, prefixed with the users name. Address the last message specifically.
      TRIGGER: "@ai"
      PROCESSING_MESSAGE: AI is processing...
      REASONING_MESSAGE: AI is thinking...
      GENERATING_MESSAGE: AI is writing...
      CONTEXT_MESSAGES: 10
      REASONING_BUDGET: 400
      DEVICE_NAME: signal-ai-bot-dev
    volumes:
      - ./data:/data
