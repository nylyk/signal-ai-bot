services:
  signal-ai-bot:
    environment:
      API_BASE: https://openrouter.ai/api/v1
      API_KEY: ${API_KEY:?put API_KEY=... in .env}
      MODEL: google/gemini-3.8-flash
      VISION: true
      AUDIO: true
      DOCUMENTS: true
      EXTRA_TOOLS: >-
        [{"type":"openrouter:web_search"},
         {"type":"openrouter:web_fetch"},
         {"type":"openrouter:image_generation",
          "parameters":{"model":"krea/krea-2-medium-turbo","resolution":"1K","aspect_ratio":"1:1"}}]
      REASONING_BUDGET: 0
